name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "source-pack.b64"
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Unpack bootstrap source bundle
        shell: bash
        run: |
          if [ -f source-pack.b64 ]; then
            base64 --decode source-pack.b64 | xz --decompress | tar -xf -
          fi
          test -f app/src/main/AndroidManifest.xml
          test -f settings.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check Android SDK availability
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            sdkmanager --install 'platforms;android-35'
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            sdkmanager --install 'build-tools;35.0.0'
          fi

      - name: Build first-wave debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SovereignFirstWave-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish readable source files after bootstrap
        if: success()
        shell: bash
        run: |
          if [ -f source-pack.b64 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app build.gradle settings.gradle gradle.properties
            git rm -f source-pack.b64
            if ! git diff --cached --quiet; then
              git commit -m "Unpack first-wave Android Studio source after successful APK build"
              git push origin HEAD:main
            fi
          fi
